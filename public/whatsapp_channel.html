<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#25D366">
<title>Join WhatsApp Channel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 10%,rgba(37,211,102,.22),transparent 32%),
    radial-gradient(circle at 90% 90%,rgba(18,140,126,.18),transparent 32%),
    #07100c;
}
.card{
  width:100%;
  max-width:430px;
  text-align:center;
  padding:34px 22px 24px;
  border-radius:30px;
  background:rgba(17,29,23,.9);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 25px 70px rgba(0,0,0,.5);
  backdrop-filter:blur(20px);
}
.logo{
  width:90px;height:90px;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:28px;
  font-size:45px;
  background:linear-gradient(135deg,#25D366,#128C7E);
  box-shadow:0 15px 40px rgba(37,211,102,.28);
}
.badge{
  display:inline-block;
  padding:6px 11px;
  border-radius:20px;
  background:rgba(37,211,102,.12);
  color:#69e895;
  font-size:11px;
  font-weight:bold;
  margin-bottom:12px;
}
h1{font-size:30px;line-height:1.15}
.subtitle{
  margin:12px auto 26px;
  max-width:340px;
  color:#a9b8ae;
  font-size:14px;
  line-height:1.65;
}
.join{
  width:100%;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border-radius:16px;
  background:#25D366;
  color:#06130a;
  text-decoration:none;
  font-size:16px;
  font-weight:800;
  box-shadow:0 10px 25px rgba(37,211,102,.2);
  transition:.2s;
}
.join:active{transform:scale(.97)}
.info{
  margin-top:18px;
  padding:13px;
  border-radius:15px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
  color:#9eaaa2;
  font-size:12px;
  line-height:1.5;
}
footer{
  margin-top:22px;
  color:#65736a;
  font-size:11px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  width:calc(100% - 36px);
  max-width:390px;
  padding:13px 16px;
  border-radius:14px;
  background:#15221b;
  border:1px solid rgba(255,255,255,.1);
  text-align:center;
  font-size:13px;
  transform:translate(-50%,100px);
  opacity:0;
  transition:.3s;
}
.toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<div class="card">
  <div class="logo">💬</div>

  <div class="badge">OFFICIAL CHANNEL</div>

  <h1>Join Our WhatsApp Channel</h1>

  <p class="subtitle">
    हमारे WhatsApp Channel को Join करें और
    latest updates, news और important announcements
    सीधे WhatsApp पर पाएं।
  </p>

  <a
    class="join"
    href="https://whatsapp.com/channel/0029Vb883F17z4kjmMDXv01k"
    target="_blank"
    rel="noopener noreferrer"
    onclick="joinClicked()"
  >
    💬 Join WhatsApp Channel
  </a>

  <div class="info">
    🔔 Join करने के बाद आपको हमारे नए updates
    WhatsApp Channel पर मिलते रहेंगे।
  </div>

  <footer>© 2026 • Official WhatsApp Channel</footer>
</div>

<div id="toast" class="toast"></div>

<script>
function joinClicked(){
  const toast=document.getElementById("toast");
  toast.textContent="💬 WhatsApp Channel खोल रहा है...";
  toast.classList.add("show");
  setTimeout(function(){
    toast.classList.remove("show");
  },1800);
}
</script>

</body>
</html>
