<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Panel — Digital Seva</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;min-height:100vh;max-width:480px;margin:0 auto}
.header{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);padding:20px 16px;border-radius:0 0 20px 20px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.7;margin-top:4px}
.container{padding:14px}

/* LOGIN */
.login-box{background:#1e293b;border-radius:16px;padding:24px;margin-top:20px}
.login-box h2{font-size:18px;margin-bottom:16px}
input{width:100%;padding:13px;background:#0f172a;border:1.5px solid #334155;border-radius:10px;color:#e2e8f0;font-size:15px;outline:none;margin-bottom:12px}
input:focus{border-color:#3b82f6}
button{width:100%;padding:13px;background:#1d4ed8;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#1e40af}
button:active{transform:scale(0.98)}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{padding:9px 16px;background:#1e293b;border:none;color:#94a3b8;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#1d4ed8;color:white}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:#1e293b;border-radius:14px;padding:16px}
.stat-card .label{font-size:11px;color:#94a3b8;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;color:white}
.stat-card .sub{font-size:11px;color:#64748b;margin-top:4px}

/* SECTION */
.section{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:12px}
.section-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}

/* USER ITEM */
.user-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #0f172a}
.user-item:last-child{border:none}
.user-avatar{width:42px;height:42px;border-radius:50%;background:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta{font-size:10px;color:#475569;margin-top:3px}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-active{background:#064e3b;color:#34d399}
.badge-inactive{background:#1e293b;color:#64748b;border:1px solid #334155}

/* PAYMENT ITEM */
.pay-item{padding:12px 0;border-bottom:1px solid #0f172a}
.pay-item:last-child{border:none}
.pay-row{display:flex;justify-content:space-between;align-items:flex-start}
.pay-name{font-size:13px;font-weight:700}
.pay-amt{font-size:15px;font-weight:800;color:#34d399}
.pay-meta{font-size:11px;color:#64748b;margin-top:3px}
.pay-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:5px;display:inline-block}
.s-completed{background:#064e3b;color:#34d399}
.s-pending{background:#451a03;color:#fb923c}
.s-pending_admin{background:#312e81;color:#a5b4fc}

/* ACTION BUTTONS */
.action-row{display:flex;gap:8px;margin-top:10px}
.btn-approve{flex:1;padding:9px;background:#064e3b;color:#34d399;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn-reject{flex:1;padding:9px;background:#450a0a;color:#f87171;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn-sm{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}

/* EMPTY */
.empty{text-align:center;padding:30px;color:#475569;font-size:13px}

/* REFRESH */
.refresh-btn{width:100%;padding:11px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px}
.refresh-btn:hover{background:#334155}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;display:none;max-width:320px;text-align:center}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginSection">
  <div class="header">
    <h1>🔐 Admin Panel</h1>
    <p>Digital Seva Panel — Admin Access</p>
  </div>
  <div class="container">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Admin Password" onkeydown="if(event.key==='Enter')adminLogin()">
      <button onclick="adminLogin()">🔐 Login Karo</button>
      <div id="loginErr" style="color:#f87171;font-size:13px;margin-top:10px;text-align:center;display:none"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1>⚙️ Admin Panel</h1>
        <p>Digital Seva — Control Center</p>
      </div>
      <button onclick="adminLogout()" style="width:auto;padding:8px 14px;background:rgba(255,255,255,.1);font-size:12px;border-radius:20px;border:none;color:white;cursor:pointer">Logout</button>
    </div>
  </div>
  <div class="container">
    <div class="stat-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Total Users</div><div class="value" id="dTotalUsers">—</div></div>
      <div class="stat-card"><div class="label">Active Members</div><div class="value" id="dActiveMembers">—</div></div>
      <div class="stat-card"><div class="label">Total Payments</div><div class="value" id="dTotalPayments">—</div></div>
      <div class="stat-card"><div class="label">Revenue</div><div class="value" id="dRevenue">—</div></div>
    </div>

    <button class="refresh-btn" onclick="loadAll()">🔄 Refresh Data</button>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('users',this)">👥 Users</button>
      <button class="tab" onclick="switchTab('payments',this)">💳 Payments</button>
      <button class="tab" onclick="switchTab('members',this)">💎 Members</button>
    </div>

    <!-- USERS TAB -->
    <div id="tab-users">
      <div class="section">
        <div class="section-title">👥 Registered Users</div>
        <div id="usersList"><div class="empty">Loading...</div></div>
      </div>
    </div>

    <!-- PAYMENTS TAB -->
    <div id="tab-payments" style="display:none">
      <div class="section">
        <div class="section-title">⏳ Pending Payments</div>
        <div id="pendingList"><div class="empty">Loading...</div></div>
      </div>
      <div class="section">
        <div class="section-title">✅ Completed Payments</div>
        <div id="completedList"><div class="empty">Loading...</div></div>
      </div>
    </div>

    <!-- MEMBERS TAB -->
    <div id="tab-members" style="display:none">
      <div class="section">
        <div class="section-title">💎 Active Members</div>
        <div id="membersList"><div class="empty">Loading...</div></div>
      </div>
    </div>

  </div>
</div>

<script>
const API = '';
let adminPassword = '';

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#7f1d1d' : '#1d4ed8';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  if(!pass) return;
  adminPassword = pass;
  fetch('/admin/stats', { headers: { 'admin-password': pass } })
    .then(r => r.json())
    .then(d => {
      if(d.success || d.totalUsers !== undefined) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadAll();
      } else {
        document.getElementById('loginErr').style.display = 'block';
        document.getElementById('loginErr').textContent = '❌ Wrong password!';
      }
    })
    .catch(() => {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('loginErr').textContent = '❌ Server error!';
    });
}

function adminLogout() {
  adminPassword = '';
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('adminPass').value = '';
}

function switchTab(tab, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function headers() { return { 'admin-password': adminPassword, 'Content-Type': 'application/json' }; }

async function loadAll() {
  await loadStats();
  await loadUsers();
  await loadPayments();
  await loadMembers();
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    if(d.success || d.totalUsers !== undefined) {
      document.getElementById('dTotalUsers').textContent = d.totalUsers || 0;
      document.getElementById('dActiveMembers').textContent = d.activeMembers || 0;
      document.getElementById('dTotalPayments').textContent = d.totalPayments || 0;
      document.getElementById('dRevenue').textContent = '₹' + (d.totalRevenue || 0);
    }
  } catch(e) {}
}

async function loadUsers() {
  try {
    const r = await fetch('/admin/users', { headers: headers() });
    const d = await r.json();
    const list = document.getElementById('usersList');
    if(!d.success || !d.users?.length) { list.innerHTML = '<div class="empty">Koi user nahi</div>'; return; }
    list.innerHTML = d.users.map(u => {
      const isActive = u.memberExpiry && new Date(u.memberExpiry) > new Date();
      const exp = u.memberExpiry ? new Date(u.memberExpiry).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : 'N/A';
      return `<div class="user-item">
        <div class="user-avatar">${u.photo ? `<img src="${u.photo}">` : '👤'}</div>
        <div class="user-info">
          <div class="user-name">${u.name || 'Unknown'}</div>
          <div class="user-email">${u.email}</div>
          <div class="user-meta">Joined: ${new Date(u.createdAt||Date.now()).toLocaleDateString('en-IN')}</div>
        </div>
        <div style="text-align:right">
          <span class="badge ${isActive?'badge-active':'badge-inactive'}">${isActive?'ACTIVE':'INACTIVE'}</span>
          ${isActive?`<div style="font-size:10px;color:#64748b;margin-top:4px">Till ${exp}</div>`:''}
        </div>
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('usersList').innerHTML = '<div class="empty">Error!</div>'; }
}

async function loadPayments() {
  try {
    const r = await fetch('/admin/pending-payments', { headers: headers() });
    const d = await r.json();
    const pending = (d.payments || []).filter(p => p.status === 'pending_admin' || p.status === 'pending');
    const completed = (d.payments || []).filter(p => p.status === 'completed');

    document.getElementById('pendingList').innerHTML = pending.length ? pending.map(p => paymentHTML(p, true)).join('') : '<div class="empty">Koi pending payment nahi</div>';
    document.getElementById('completedList').innerHTML = completed.length ? completed.map(p => paymentHTML(p, false)).join('') : '<div class="empty">Koi completed payment nahi</div>';
  } catch(e) {
    document.getElementById('pendingList').innerHTML = '<div class="empty">Error!</div>';
  }
}

function paymentHTML(p, showActions) {
  const date = new Date(p.createdAt||Date.now()).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const sc = p.status==='completed'?'s-completed':p.status==='pending_admin'?'s-pending_admin':'s-pending';
  return `<div class="pay-item">
    <div class="pay-row">
      <div>
        <div class="pay-name">${p.userName||p.userEmail||'User'}</div>
        <div class="pay-meta">${p.userEmail||''} · ${date}</div>
        <div class="pay-meta">Plan: ${(p.plan||'').toUpperCase()} · TXN: ${p.transactionId||'—'}</div>
      </div>
      <div class="pay-amt">₹${p.amount||0}</div>
    </div>
    <span class="pay-status ${sc}">${p.status}</span>
    ${showActions ? `<div class="action-row">
      <button class="btn-approve" onclick="approvePayment('${p._id}','${p.userId}','${p.plan}')">✅ Approve</button>
      <button class="btn-reject" onclick="rejectPayment('${p._id}')">❌ Reject</button>
    </div>` : ''}
  </div>`;
}

async function approvePayment(paymentId, userId, plan) {
  if(!confirm('Approve karein?')) return;
  try {
    const r = await fetch('/admin/approve-payment', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ paymentId, userId, plan })
    });
    const d = await r.json();
    if(d.success) { showToast('✅ Payment approved!'); loadAll(); }
    else showToast('❌ ' + d.message, true);
  } catch(e) { showToast('❌ Error!', true); }
}

async function rejectPayment(paymentId) {
  if(!confirm('Reject karein?')) return;
  try {
    const r = await fetch('/admin/reject-payment', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ paymentId })
    });
    const d = await r.json();
    if(d.success) { showToast('🗑️ Payment rejected'); loadAll(); }
    else showToast('❌ ' + d.message, true);
  } catch(e) { showToast('❌ Error!', true); }
}

async function loadMembers() {
  try {
    const r = await fetch('/admin/users', { headers: headers() });
    const d = await r.json();
    const list = document.getElementById('membersList');
    const now = new Date();
    const activeUsers = (d.users||[]).filter(u => u.memberExpiry && new Date(u.memberExpiry) > now);
    if(!activeUsers.length) { list.innerHTML = '<div class="empty">Koi active member nahi</div>'; return; }
    list.innerHTML = activeUsers.map(u => {
      const exp = new Date(u.memberExpiry).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
      const daysLeft = Math.ceil((new Date(u.memberExpiry)-now)/(1000*60*60*24));
      return `<div class="user-item">
        <div class="user-avatar">${u.photo?`<img src="${u.photo}">`:'💎'}</div>
        <div class="user-info">
          <div class="user-name">${u.name||'Unknown'}</div>
          <div class="user-email">${u.email}</div>
          <div class="user-meta">Till: ${exp}</div>
        </div>
        <div style="text-align:right">
          <span class="badge badge-active">ACTIVE</span>
          <div style="font-size:11px;color:#34d399;margin-top:4px;font-weight:700">${daysLeft}d left</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('membersList').innerHTML = '<div class="empty">Error!</div>'; }
}

document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });
</script>
</body>
</html>
